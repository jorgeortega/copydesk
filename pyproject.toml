[project]
name = "copydesk"
version = "0.1.0"
description = "Multi-agent ad-copy pipeline with a compliance gate (fictional brand: Acme Telehealth)."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.11",
    "langgraph>=1.2.23",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
